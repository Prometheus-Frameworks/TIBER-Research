job_id: keenan-allen-ind-signing
job_version: v1
purpose: >-
  Establish whether the 2026-08-17 Keenan Allen / Indianapolis transaction can
  be represented as bounded, source-linked TIBER custody reality, and express
  it as an unpromoted candidate player_ownership_change_event_v0 record. This
  job deliberately stops at representability: it infers no role, alignment,
  snap share, target share, personnel usage, or downstream fantasy effect for
  Allen or for any other player (TIBER-Research issue #13, system lane).
questions:
  - question_id: q1-transaction-attestation
    prompt: >-
      Is the Allen-to-Indianapolis transaction attested by admitted reporting
      inside the observation window, with agreement on player, direction,
      destination team, and date?
  - question_id: q2-identity-and-current-association
    prompt: >-
      Does Keenan Allen resolve to a canonical TIBER identity, and which team
      does TIBER's own governed state currently associate him with?
  - question_id: q3-candidate-representability
    prompt: >-
      Can the transaction be expressed as a contract-conformant candidate
      player_ownership_change_event_v0 record inside research custody, without
      asserting governed roster truth or exceeding research authority?
