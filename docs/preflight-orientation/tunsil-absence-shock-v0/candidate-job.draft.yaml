stop_conditions:
  - Stop after one packet is submitted, reviewed, and sealed.
cancellation_conditions:
  - Cancel on an explicit operator cancellation record.
blocked_conditions:
  - Block if no admitted evidence path supports at least one full claim →
    counterevidence → challenge → packet → review → seal path.
inconclusive_conditions:
  - Mark inconclusive where admitted evidence cannot assess a claim; do not
    substitute proxies for missing route, protection, pressure, or
    availability witnesses.
escalation_conditions:
  - Escalate any request for network access, source acquisition, proxy
    fabrication, or downstream mutation.
response_branches:
  - branch_id: h1-replacement-holds
    label: H1 — Replacement holds
    description: Coleman remains serviceable without materially greater help.
    expected_signals:
      - Stable chip/double-team and six-/seven-man protection rates.
      - Stable quick-pressure and sack rates.
      - Stable play-action/deep-attempt profile.
      - Stable McLaurin air-yard opportunity.
      - No meaningful White/Croskey-Merritt passing-down redistribution
        attributable to protection.
  - branch_id: h2-successful-adaptation
    label: H2 — Successful adaptation
    description: >-
      Washington preserves quarterback conditions by redistributing
      protection and changing play design.
    expected_signals:
      - More chips, double teams, tight-end or running-back protection.
      - More quick game, under-center play action, movement, or rollouts.
      - McLaurin target opportunity holding better than target depth or
        explosive efficiency.
      - White gaining passing-down snaps, with routes and pass blocks
        reported separately.
      - Croskey-Merritt early-down rushing remaining more stable than his
        third-down/two-minute role.
  - branch_id: h3-protection-failure
    label: H3 — Protection failure
    description: Adaptation does not fully compensate for the replacement.
    expected_signals:
      - Higher quick-pressure, pressure-to-sack, hit, throwaway, or scramble
        rates.
      - Lower depth of target and explosive-pass frequency.
      - Fewer sustained and scoring drives.
      - Lower passing efficiency for Daniels.
      - Offense-wide efficiency pressure that cannot be represented as one
        player's lost workload.
terminal_decisions:
