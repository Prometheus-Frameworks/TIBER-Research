# DRAFT CANDIDATE JOB — NOT ACTIVATED, NOT A PREFLIGHT ARTIFACT.
# Operator-review draft mapping TIBER-Research issue #3 onto research-job/v0.1.
# Every value marked OPERATOR-INPUT requires an explicit operator binding
# (see README.md §3) before this can become a real candidate job. Placed under
# docs/ deliberately; the real job.yaml is authored only inside an authorized
# preflight package.
schema_version: research-job/v0.1
synthetic_fixture: false
job_id: tunsil-absence-shock
job_version: v1
purpose: >-
  Bounded offense-to-fantasy causal cross-examination of the 2026-08-08
  Laremy Tunsil torn-triceps event: test whether TIBER can translate the loss
  of a non-fantasy infrastructure player through the Washington offense
  without applying a narrative-only blanket downgrade (TIBER-Research issue
  #3, Lane 1).
questions:
  - question_id: q1-availability-replacement-state
    prompt: >-
      Is Tunsil unavailable for the observation window, is Coleman the actual
      replacement, and is the surrounding line configuration correctly
      identified?
  - question_id: q2-protection-quality-pressure
    prompt: >-
      Does replacing Tunsil with Coleman create a material expected reduction
      in isolated protection quality or increase the need for schematic help?
  - question_id: q3-quarterback-playcalling-response
    prompt: >-
      Does the absence change protection count, pressure conditions, time to
      throw, scramble/throwaway behavior, play action, quick game, rollout
      usage, depth of target, or explosive-pass opportunity?
  - question_id: q4-backfield-constraint-redistribution
    prompt: >-
      Does Washington increase running-back protection or chip participation,
      with any additional White snaps correctly separated into pass blocks,
      chip-and-release routes, full routes, carries, and targets, and does
      Croskey-Merritt lose passing-down participation without an assumed
      early-down carry loss?
  - question_id: q5-mclaurin-opportunity-vs-efficiency
    prompt: >-
      Separately from efficiency: does McLaurin's target/first-read
      opportunity change; and separately from opportunity: do his air yards,
      target depth, play-action/deep usage, YPRR, explosive conversion,
      red-zone opportunity, or touchdown ceiling change?
mode: bounded_domain_research
output_class: structured_research_packet
subjects:
  # Governed GSIS bindings re-resolved at freeze from pinned artifacts.
  - subject_id: laremy-tunsil
    label: Laremy Tunsil (LT, WAS) — run-scoped identity, no governed GSIS
    kind: player-run-scoped
  - subject_id: brandon-coleman
    label: Brandon Coleman (LT replacement, WAS) — run-scoped identity
    kind: player-run-scoped
  - subject_id: was-oline-configuration
    label: >-
      Washington offensive-line configuration (C. Paul LG, Conerly RT, Wylie
      swing) — run-scoped composite subject
    kind: unit-run-scoped
  - subject_id: jayden-daniels
    label: Jayden Daniels (QB, WAS)
    kind: player
    aliases: ["gsis 00-0039910"]
  - subject_id: terry-mclaurin
    label: Terry McLaurin (WR, WAS)
    kind: player
    aliases: ["gsis 00-0035659"]
  - subject_id: rachaad-white
    label: Rachaad White (RB, WAS)
    kind: player
    aliases: ["gsis 00-0037256"]
  - subject_id: jacory-croskey-merritt
    label: Jacory Croskey-Merritt (RB, WAS)
    kind: player
    aliases: ["gsis 00-0040242"]
comparison_population:
  mode: closed
  members:
    - subject_id: jeremy-mcnichols
